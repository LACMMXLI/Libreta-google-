version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreta_consumos_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-libreta_user}:${POSTGRES_PASSWORD:-libreta_secret}@postgres:5432/${POSTGRES_DB:-libreta_db}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: libreta_consumos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libreta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libreta_secret}
      POSTGRES_DB: ${POSTGRES_DB:-libreta_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

volumes:
  postgres_data:
