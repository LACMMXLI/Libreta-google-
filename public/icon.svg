<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3027" />
      <stop offset="100%" stop-color="#241D17" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDE6D6" />
      <stop offset="10%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#FAF7F2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background / Base -->
  <rect width="512" height="512" rx="100" fill="#2E2822" />

  <!-- Notebook page -->
  <rect x="80" y="60" width="370" height="392" rx="20" fill="url(#pageGrad)" filter="url(#shadow)" />

  <!-- Binder rings / spiral holes on the left -->
  <g fill="#4A3E34">
    <rect x="56" y="90" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="96" r="6" fill="#241D17" />

    <rect x="56" y="150" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="156" r="6" fill="#241D17" />

    <rect x="56" y="210" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="216" r="6" fill="#241D17" />

    <rect x="56" y="270" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="276" r="6" fill="#241D17" />

    <rect x="56" y="330" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="336" r="6" fill="#241D17" />

    <rect x="56" y="390" width="48" height="12" rx="6" fill="#8C7E72"/>
    <circle cx="80" cy="396" r="6" fill="#241D17" />
  </g>

  <!-- Ruled notebook lines -->
  <line x1="120" y1="140" x2="410" y2="140" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="120" y1="190" x2="410" y2="190" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="120" y1="240" x2="410" y2="240" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="120" y1="290" x2="410" y2="290" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="120" y1="340" x2="410" y2="340" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Margin line (red notebook margin) -->
  <line x1="150" y1="60" x2="150" y2="452" stroke="#E29578" stroke-width="2" stroke-opacity="0.7" />

  <!-- Stylized checkmark / dollar sign / pencil stamp -->
  <g transform="translate(240, 200)">
    <circle cx="45" cy="45" r="55" fill="#2D6A4F" />
    <path d="M25 46 L38 60 L68 28" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
